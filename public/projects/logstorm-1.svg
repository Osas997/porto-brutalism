<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#F2F7F5" stroke="#000000" stroke-width="6"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#000000" stroke-width="1" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#grid)" />
  <g transform="translate(50, 40)">
    <rect width="500" height="60" fill="#FAAE2B" stroke="#000000" stroke-width="4" rx="4"/>
    <text x="250" y="38" font-family="monospace" font-size="18" font-weight="bold" fill="#000000" text-anchor="middle">LOGSTORM // INGESTION RATES</text>
  </g>
  <g transform="translate(50, 130)">
    <rect width="500" height="220" fill="#FFFFFF" stroke="#000000" stroke-width="4" rx="4"/>
    <line x1="50" y1="170" x2="450" y2="170" stroke="#000000" stroke-width="2" stroke-dasharray="4"/>
    <line x1="50" y1="90" x2="450" y2="90" stroke="#000000" stroke-width="2" stroke-dasharray="4"/>
    <line x1="50" y1="20" x2="50" y2="190" stroke="#000000" stroke-width="3"/>
    <line x1="50" y1="190" x2="470" y2="190" stroke="#000000" stroke-width="3"/>
    <path d="M 50 160 L 100 150 L 150 140 L 200 120 L 250 100 L 300 80 L 350 70 L 400 45 L 450 30" fill="none" stroke="#10B981" stroke-width="4"/>
    <circle cx="450" cy="30" r="6" fill="#FAAE2B" stroke="#000000" stroke-width="2"/>
    <text x="45" y="195" font-family="monospace" font-size="12" fill="#000000" text-anchor="end">0 req</text>
    <text x="45" y="95" font-family="monospace" font-size="12" fill="#000000" text-anchor="end">50k req</text>
    <text x="45" y="25" font-family="monospace" font-size="12" fill="#000000" text-anchor="end">100k req</text>
  </g>
</svg>
