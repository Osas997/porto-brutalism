<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#F2F7F5" stroke="#000000" stroke-width="6"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#000000" stroke-width="1" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#grid)" />
  <g transform="translate(50, 40)">
    <rect width="500" height="60" fill="#FAAE2B" stroke="#000000" stroke-width="4" rx="4"/>
    <text x="250" y="38" font-family="monospace" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">SECUREGATE // RATE LIMITING ENGINE</text>
  </g>
  <g transform="translate(50, 130)">
    <rect width="500" height="220" fill="#FFFFFF" stroke="#000000" stroke-width="4" rx="4"/>
    <text x="250" y="110" font-family="monospace" font-size="18" font-weight="bold" fill="#1E293B" text-anchor="middle">[ Sliding Window Redis Log Charts ]</text>
  </g>
</svg>