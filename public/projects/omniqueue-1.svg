<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#F2F7F5" stroke="#000000" stroke-width="6"/>
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#000000" stroke-width="1" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#grid)" />
  <!-- Neobrutalist Title Box -->
  <g transform="translate(50, 40)">
    <rect width="500" height="60" fill="#FAAE2B" stroke="#000000" stroke-width="4" rx="4"/>
    <text x="250" y="38" font-family="monospace" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">OMNIQUEUE // ACTIVE JOB METRICS</text>
  </g>
  <!-- Chart lines -->
  <g transform="translate(50, 130)">
    <rect width="500" height="220" fill="#FFFFFF" stroke="#000000" stroke-width="4" rx="4"/>
    <!-- Grid inside chart -->
    <line x1="50" y1="170" x2="450" y2="170" stroke="#000000" stroke-width="2" stroke-dasharray="4"/>
    <line x1="50" y1="90" x2="450" y2="90" stroke="#000000" stroke-width="2" stroke-dasharray="4"/>
    <!-- Axes -->
    <line x1="50" y1="20" x2="50" y2="190" stroke="#000000" stroke-width="3"/>
    <line x1="50" y1="190" x2="470" y2="190" stroke="#000000" stroke-width="3"/>
    <!-- Graph -->
    <path d="M 50 150 L 100 120 L 150 160 L 200 80 L 250 140 L 300 60 L 350 110 L 400 40 L 450 90" fill="none" stroke="#EF4444" stroke-width="4"/>
    <!-- Scatter dots -->
    <circle cx="200" cy="80" r="6" fill="#FAAE2B" stroke="#000000" stroke-width="2"/>
    <circle cx="300" cy="60" r="6" fill="#FAAE2B" stroke="#000000" stroke-width="2"/>
    <circle cx="400" cy="40" r="6" fill="#FAAE2B" stroke="#000000" stroke-width="2"/>
    <!-- Labels -->
    <text x="45" y="195" font-family="monospace" font-size="12" fill="#000000" text-anchor="end">0ms</text>
    <text x="45" y="95" font-family="monospace" font-size="12" fill="#000000" text-anchor="end">50ms</text>
    <text x="45" y="25" font-family="monospace" font-size="12" fill="#000000" text-anchor="end">100ms</text>
  </g>
</svg>
